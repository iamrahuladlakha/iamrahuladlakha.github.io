<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
<script>
  /* Apply the remembered theme before first paint (no flash). Storage can be blocked, so guard it. */
  (function () {
    var d = document.documentElement;
    d.classList.add("js");
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") d.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
{% seo %}
{% feed_meta %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">

{%- if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.author.name | jsonify }},
  "jobTitle": {{ site.tagline | jsonify }},
  "description": {{ site.description | jsonify }},
  "url": {{ site.url | append: '/' | jsonify }},
  "image": {{ site.avatar | absolute_url | jsonify }},
  "email": {{ site.author.email | prepend: 'mailto:' | jsonify }},
  "sameAs": {{ site.social.links | jsonify }}
}
</script>
{%- endif %}
