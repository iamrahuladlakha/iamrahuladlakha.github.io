name = "blog-comments"
main = "src/index.js"
compatibility_date = "2025-11-01"

[vars]
ALLOWED_ORIGINS = "https://iamrahuladlakha.github.io"

# Secrets (wrangler secret put): TURNSTILE_SECRET, ADMIN_TOKEN, IP_SALT (16+ chars). Local dev reads them, and the
# localhost ALLOWED_ORIGINS, from .dev.vars (gitignored).
[[d1_databases]]
binding = "DB"
database_name = "blog-comments"
database_id = "REPLACE_AFTER_CREATE"
